<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Moataz Badawy</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(ellipse 85% 55% at 50% -12%, rgba(61, 139, 255, 0.16), transparent 60%),
        linear-gradient(180deg, #0C1630 0%, #091019 100%);
      color: #E6EDF7;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 24%, rgba(245,231,193,.9) 0 1px, transparent 2.2px),
        radial-gradient(circle at 27% 66%, rgba(245,231,193,.5) 0 1px, transparent 2px),
        radial-gradient(circle at 43% 14%, rgba(245,231,193,.75) 0 1px, transparent 2px),
        radial-gradient(circle at 61% 79%, rgba(245,231,193,.45) 0 1px, transparent 2px),
        radial-gradient(circle at 76% 32%, rgba(245,231,193,.85) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 88% 57%, rgba(245,231,193,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 19% 87%, rgba(245,231,193,.4) 0 1px, transparent 2px),
        radial-gradient(circle at 69% 9%, rgba(245,231,193,.6) 0 1px, transparent 2px),
        radial-gradient(circle at 34% 41%, rgba(61,139,255,.5) 0 1.4px, transparent 2.6px),
        radial-gradient(circle at 83% 85%, rgba(61,139,255,.4) 0 1px, transparent 2.4px);
    }
    .content { position: relative; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }
    .mark { width: 84px; height: 84px; }
    h1 {
      font-family: 'Poppins', 'Inter', sans-serif;
      font-size: clamp(3.2rem, 10vw, 5rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
      color: #F5E7C1;
    }
    p { font-size: 1.02rem; line-height: 1.7; opacity: 0.72; }
    .btn {
      margin-top: 0.6rem;
      display: inline-block;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      background: #3D8BFF;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .btn:hover { background: #2f7ae8; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="stars"></div>
  <main class="content">
    <svg class="mark" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="96" height="96" rx="22" fill="#3D8BFF"/>
      <g transform="translate(48 48) scale(0.74) translate(-44.5 -48)" fill="none" stroke="#0A1220" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M14 67 V29 L27 51 L40 29 V67"/>
        <path d="M52 67 V29 H63 Q74 29 74 38.75 Q74 48.5 63 48.5 H52"/>
        <path d="M52 48.5 H64 Q75 48.5 75 57.75 Q75 67 64 67 H52"/>
      </g>
    </svg>
    <h1>404</h1>
    <p>This page drifted off into space. Let's get you back to familiar orbit.</p>
    <a class="btn" href="/">Back to the portfolio</a>
  </main>
</body>
</html>
